
spring.application.name=order-service
server.port=9080

#PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/DuJiaCun_Cloud_Order
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.mapper-locations= classpath:mapper/*.xml

#JWT
app.jwt.secret=MySuperSecretKeyForJWTAuthThatIsLongEnough32Bytes
app.jwt.expiration=86400000

#redis
spring.data.redis.host=192.168.0.152
spring.data.redis.port=6379
spring.data.redis.password=root
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=1
spring.redis.lettuce.pool.max-wait=10s

#log
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Eureka
eureka.client.service-url.defaultZone=http://localhost:1234/eureka