spring:
  application:
    name: user-service
  cloud:
    openfeign:
      client:
        config:
          default:
              connect-timeout: 3000
              read-timeout: 10000
  datasource:
    url: jdbc:postgresql://localhost:5432/DuJiaCun_Cloud_User
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: 192.168.0.152
      port: 6379
      password: root

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl