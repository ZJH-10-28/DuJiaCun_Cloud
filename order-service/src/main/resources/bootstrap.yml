# 服务基础信息（必须与 Nacos 中 Data ID 规则匹配）
spring:
  application:
    name: order-service  # 服务唯一标识（决定 Nacos 中的配置文件名）
  profiles:
    active: dev  # 指定运行环境（决定加载 order-service-dev.yaml）
  cloud:
    nacos:
      # 配置中心配置
      config:
        server-addr: 192.168.0.101:8848  # Nacos server地址
        namespace: public                # 生产环境命名空间ID（必须与注册中心一致）
        group: DEFAULT_GROUP               # 自定义分组（避免与默认组冲突）
        file-extension: yaml             # 配置文件格式
        refresh-enabled: true            # 开启配置动态刷新（默认true）
        timeout: 3000                    # 连接超时时间（毫秒）
        # 配置自动刷新间隔（默认30秒，生产环境建议30~60秒）
        refresh-interval: 30000
        # 关键！指定配置文件加载顺序（先加载共享配置，再加载服务专属配置）
        shared-configs:
#          - data-id: common-prod.yaml   # 全局共享配置（如数据库连接池）
#            group: COMMON_GROUP
#            refresh: false               # 共享配置通常不需热更新
          - data-id: order-service-dev.yaml  # 服务基础配置（如日志级别）
            group: DEFAULT_GROUP
            refresh: true

      # 服务注册配置（与配置中心共用同一套连接参数）
      discovery:
        server-addr: ${spring.cloud.nacos.config.server-addr}
        namespace: ${spring.cloud.nacos.config.namespace}
        group: ${spring.cloud.nacos.config.group}
        # 心跳间隔（默认5秒）
        heartbeat-interval: 5000
        # 健康检查超时（默认15秒）
        ip-delete-timeout: 15000