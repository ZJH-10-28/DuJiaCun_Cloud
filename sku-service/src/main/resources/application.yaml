server:
  port: 7070

spring:
  application:
    name: sku-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000 # 连接超时3秒
            read-timeout: 5000 # 读取超时5秒
  datasource:
    url: jdbc:postgresql://localhost:5432/DuJiaCun_Cloud_Sku
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: 192.168.0.152
      port: 6379
      password: root
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl