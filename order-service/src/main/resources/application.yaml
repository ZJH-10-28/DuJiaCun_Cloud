spring:
  application:
    name: order-service
  cloud:
    loadbalancer:
      retry:
        enabled: false # 控制负载均衡的重试功能 :存在多个健康的实例时,会触发一次重试
      nacos:
        enabled: true # Nacos 特有的负载均衡配置 , 关闭变成 Spring Cloud LoadBalancer 的默认策略
    openfeign:
      client:
        config:
          default: #全局默认设置
#            retryer: feign.Retryer.NEVER_RETRY # 关闭feign重试
            connect-timeout: 3000 # 连接超时3秒
            read-timeout: 6000 # 读取超时6秒 , 需要大于seata的超时时间
  datasource:
    url: jdbc:postgresql://localhost:5432/DuJiaCun_Cloud_Order
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: 192.168.0.152
      port: 6379
      password: root
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 1
          max-wait: 10s

server:
  port: 9080

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

seata:
  enable-auto-data-source-proxy: true
  store-mode: db
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
    timeout: 5000 # 默认超时时间 5 秒
  registry:
    type: file
  config:
    type: file