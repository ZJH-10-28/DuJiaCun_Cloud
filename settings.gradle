//统一管理项目中所有 Gradle 插件的来源仓库  全局生效
pluginManagement {
    // 由上到下依次检索
    repositories {
        // 阿里云 Gradle 插件镜像
        //maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        // 阿里云 Maven 镜像
        //maven { url 'https://maven.aliyun.com/repository/public' }

        //Gradle 官方插件  包含Spring Boot Gradle 插件
        gradlePluginPortal()
        //Maven 中央仓库   Spring Boot 相关依赖库
        //作用：作为备用仓库，确保插件和依赖的完整性
        mavenCentral()
    }
}

//引入的模块
rootProject.name = 'DuJiaCun_Cloud'
include 'common'
include 'order-service'
include 'user-service'
include 'gateway'
include 'sku-service'