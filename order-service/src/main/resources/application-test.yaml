spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.0.101:8848
        cluster-name: SY
    loadbalancer:
      nacos:
        enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/DuJiaCun_Cloud_Order
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: 192.168.0.152
      port: 6379
      password: root
  redis:
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 1
        max-wait: 10s

server:
  port: 9080

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  jwt:
    secret: MySuperSecretKeyForJWTAuthThatIsLongEnough32Bytes
    expiration: 86400000